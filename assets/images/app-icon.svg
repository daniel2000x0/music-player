<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img">
  <title>Abyssal music player icon</title>
  <desc>
    A hooded fantasy silhouette wearing luminous headphones, crowned by a crystal shaped like a
    musical note.
  </desc>

  <defs>
    <radialGradient id="night" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#152441" />
      <stop offset=".55" stop-color="#090f20" />
      <stop offset="1" stop-color="#03050c" />
    </radialGradient>
    <linearGradient id="mist" x1="332" y1="292" x2="720" y2="755">
      <stop stop-color="#f1fbff" />
      <stop offset=".48" stop-color="#91dcec" />
      <stop offset="1" stop-color="#8185c9" />
    </linearGradient>
    <linearGradient id="crystal" x1="488" y1="202" x2="555" y2="480">
      <stop stop-color="#f8ffff" />
      <stop offset=".42" stop-color="#88e4ef" />
      <stop offset="1" stop-color="#7479c3" />
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#night)" />

  <!-- The hood and shoulders form one strong, readable silhouette. -->
  <path
    d="M264 774c18-101 71-164 147-195-39-38-62-93-62-155 0-119 72-218 163-218s163 99 163 218c0 62-23 117-62 155 76 31 129 94 147 195-75 53-158 78-248 78s-173-25-248-78Z"
    fill="#070b15" stroke="#273856" stroke-width="18" stroke-linejoin="round" />

  <!-- Crystal antlers keep the fantasy geometry broad enough for icon scale. -->
  <path
    d="m394 340-79-105 25 133-75-42 78 110m287-96 79-105-25 133 75-42-78 110"
    fill="none" stroke="#587f9b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <path
    d="m320 238 17-91 45 78-42 143Zm389 0-17-91-45 78 42 143Z"
    fill="#152c45" stroke="#8acbd8" stroke-width="12" stroke-linejoin="round" />

  <!-- Headphones and their bridge frame the face as a single music symbol. -->
  <path
    d="M332 487v-54c0-123 80-218 180-218s180 95 180 218v54"
    fill="none" stroke="url(#mist)" stroke-width="32" stroke-linecap="round" filter="url(#soft-glow)" />
  <path
    d="M327 465c-39 0-68 34-68 82v45c0 48 29 82 68 82h38V465h-38Zm370 0c39 0 68 34 68 82v45c0 48-29 82-68 82h-38V465h38Z"
    fill="#101a2a" stroke="url(#mist)" stroke-width="22" stroke-linejoin="round" />

  <!-- A faceted note grows from the forehead like a luminous gem. -->
  <path
    d="m512 278 58 92-27 128h-62l-27-128 58-92Z"
    fill="url(#crystal)" stroke="#ddfbff" stroke-width="12" stroke-linejoin="round" />
  <path
    d="M512 289v190m-50-107h100"
    fill="none" stroke="#48799a" stroke-width="10" stroke-linecap="round" opacity=".8" />
  <path
    d="M543 477v118c0 45-30 75-76 75-32 0-57-18-57-46 0-31 29-51 65-51 17 0 32 4 44 11"
    fill="none" stroke="url(#mist)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Minimal facial marks preserve the mysterious character at 60 px. -->
  <path
    d="M425 528c29-19 58-21 87-6 29-15 58-13 87 6"
    fill="none" stroke="#8ec6d4" stroke-width="13" stroke-linecap="round" />
  <path
    d="m465 698 47 30 47-30"
    fill="none" stroke="#526b86" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
